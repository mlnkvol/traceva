[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short -m "not requires_sam and not requires_vlm"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_sam: marks tests that need SAM2 weights (deselect by default)
    requires_vlm: marks tests that need Florence-2 weights (deselect by default)
